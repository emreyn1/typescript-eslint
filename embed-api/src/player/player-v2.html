<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Player</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden}
#video{width:100%;height:100%;display:block;background:#000;object-fit:contain}
/* Fixed-size, no-layout-shift loading indicator (CLS-safe) */
#loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;z-index:2}
#loader.hidden{display:none}
.spin{width:44px;height:44px;border:3px solid rgba(255,255,255,.15);border-top-color:#fff;border-radius:50%;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<!-- Video element is the LCP target; rendered immediately, no blocking resources above it -->
<video id="video" playsinline webkit-playsinline controls preload="metadata"></video>
<div id="loader"><div class="spin"></div></div>

<!--
  hls.js is loaded with `defer` so it never blocks parsing or the LCP paint of the
  <video> element. The player boots from DOMContentLoaded once the lib is ready.
-->
<script defer src="https://cdn.jsdelivr.net/npm/hls.js@1.5/dist/hls.min.js"></script>

<script>
(function () {
  // The route substitutes 'in place' below. For /watch this is the ad-free source;
  // for /embed it is the same source (ads are layered separately via the ad-bumper slot).
  var HLS_SOURCE = '{{HLS_SOURCE}}';

  // Derive media context from the request path (the route serves this template at
  // /watch|/embed/movie/:id or /watch|/embed/tv/:id/:season/:episode). No extra
  // template substitution is required for these values.
  var ctx = (function () {
    var m = (location.pathname || '').match(/\/(?:watch|embed)\/(movie|tv)\/\d+(?:\/(\d+)\/(\d+))?/);
    if (!m) return { mediaType: 'movie', season: undefined, episode: undefined };
    return {
      mediaType: m[1] === 'tv' ? 'tv' : 'movie',
      season: m[2] ? Number(m[2]) : undefined,
      episode: m[3] ? Number(m[3]) : undefined
    };
  })();

  var video = document.getElementById('video');
  var loader = document.getElementById('loader');
  function hideLoader() { if (loader) loader.classList.add('hidden'); }

  // ---- Passive postMessage emitter (history sync; never mutates playback) ----
  // Posts { type: "PLAYER_EVENT", data: { event, currentTime, duration, mediaType, season, episode } }
  // for play/pause/seeked/ended/timeupdate. timeupdate is throttled to keep this CWV-light.
  var lastEmit = 0;
  function emit(eventName) {
    try {
      if (eventName === 'timeupdate') {
        var now = Date.now();
        if (now - lastEmit < 5000) return; // throttle: at most one timeupdate / 5s
        lastEmit = now;
      }
      var payload = {
        type: 'PLAYER_EVENT',
        data: {
          event: eventName,
          currentTime: video.currentTime || 0,
          duration: isFinite(video.duration) ? video.duration : 0,
          mediaType: ctx.mediaType,
          season: ctx.season,
          episode: ctx.episode
        }
      };
      // Target the parent frame (cinex /watch host or arbitrary embed consumer).
      if (window.parent && window.parent !== window) {
        window.parent.postMessage(payload, '*');
      }
    } catch (e) { /* passive: swallow */ }
  }

  function wireEvents() {
    video.addEventListener('play', function () { emit('play'); });
    video.addEventListener('pause', function () { emit('pause'); });
    video.addEventListener('seeked', function () { emit('seeked'); });
    video.addEventListener('ended', function () { emit('ended'); });
    video.addEventListener('timeupdate', function () { emit('timeupdate'); });
    video.addEventListener('loadeddata', hideLoader, { once: true });
    video.addEventListener('canplay', hideLoader, { once: true });
  }

  function attachSource() {
    if (!HLS_SOURCE || HLS_SOURCE.indexOf('{{') === 0) { hideLoader(); return; }

    // Native HLS (Safari / iOS) — lightest path, no library needed.
    if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = HLS_SOURCE;
      return;
    }

    if (window.Hls && window.Hls.isSupported()) {
      var hls = new window.Hls({ lowLatencyMode: false, enableWorker: true });
      hls.loadSource(HLS_SOURCE);
      hls.attachMedia(video);
      hls.on(window.Hls.Events.ERROR, function (_e, data) {
        if (data && data.fatal) {
          switch (data.type) {
            case window.Hls.ErrorTypes.NETWORK_ERROR: hls.startLoad(); break;
            case window.Hls.ErrorTypes.MEDIA_ERROR: hls.recoverMediaError(); break;
            default: hideLoader(); break;
          }
        }
      });
      return;
    }

    // Last-resort: assign directly and let the browser try.
    video.src = HLS_SOURCE;
  }

  function boot() {
    wireEvents();
    // hls.js may still be loading (defer); poll briefly without blocking paint.
    if (window.Hls || video.canPlayType('application/vnd.apple.mpegurl')) {
      attachSource();
    } else {
      var tries = 0;
      var t = setInterval(function () {
        if (window.Hls || ++tries > 100) { // ~10s max
          clearInterval(t);
          attachSource();
        }
      }, 100);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>

<!--
  Ad bumper injection point (the single substitution token follows this comment):
  - Public /embed surface  -> injects the ad-bumper wiring (loaded deferred/async,
    so it never blocks LCP or the player shell).
  - cinex /watch surface   -> replaced with nothing (ad-free).
-->
{{AD_BUMPER}}

<!-- Fingerprint + anti-debug protection (injected by the route, same as the legacy template). -->
{{FINGERPRINT_SCRIPT}}
{{ANTIDEBUG_SCRIPT}}
</body>
</html>
