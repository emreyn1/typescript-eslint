# Standalone WebRTC signaling server for chess-lichess-fork
# Run: docker compose -f docker-compose.signaling.yml up -d
# Or alongside lila-docker after ./lila-docker start

services:
  chess-signaling:
    build:
      context: ./signaling-server
      dockerfile: Dockerfile
    ports:
      - "3012:3012"
    environment:
      PORT: "3012"
      LICHESS_ORIGIN: ${LICHESS_ORIGIN:-http://localhost:8080}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3012/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
