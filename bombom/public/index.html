<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BomBom — Multiplayer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f0f1a;--surface:#1a1a2e;--accent:#fbbf24;--danger:#f87171;
  --success:#34d399;--text:#e5e5e5;--sub:#888;--border:#2a2a4a;
}
html,body{width:100%;height:100%;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden}
#lobby,#game{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#game{display:none;flex-direction:column;gap:8px}

/* Lobby */
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:40px 48px;text-align:center;max-width:360px;width:100%}
.logo{font-size:52px;margin-bottom:4px}
h1{font-size:28px;font-weight:800;letter-spacing:-1px;margin-bottom:4px}
h1 span{color:var(--accent)}
.sub{color:var(--sub);font-size:13px;margin-bottom:28px}
input{width:100%;padding:12px 16px;background:#111;border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:15px;margin-bottom:16px;outline:none;transition:.2s}
input:focus{border-color:var(--accent)}
button.play{width:100%;padding:14px;background:var(--accent);color:#0f0f0a;font-size:16px;font-weight:700;border:none;border-radius:8px;cursor:pointer;transition:.2s}
button.play:hover{filter:brightness(1.1);transform:translateY(-1px)}
.hint{color:var(--sub);font-size:12px;margin-top:16px}

/* Game HUD */
#hud{display:flex;justify-content:center;gap:12px;padding:4px 12px;flex-wrap:wrap}
.player-card{background:var(--surface);border:2px solid var(--border);border-radius:8px;padding:6px 12px;display:flex;align-items:center;gap:8px;font-size:13px}
.player-card.me{border-color:var(--accent)}
.player-card.dead{opacity:.4}
.dot{width:12px;height:12px;border-radius:50%}
.lives{color:var(--danger)}
.stats{color:var(--sub);font-size:11px}

/* Canvas */
#canvas-wrap{position:relative;flex:1;display:flex;align-items:center;justify-content:center}
canvas{border-radius:8px;image-rendering:pixelated}

/* Mobile controls */
#dpad{position:absolute;bottom:16px;left:16px;display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px);gap:4px}
#dpad button{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:8px;color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:none}
#dpad button:active{background:rgba(255,255,255,.25)}
.d-up{grid-column:2;grid-row:1}
.d-left{grid-column:1;grid-row:2}
.d-center{grid-column:2;grid-row:2}
.d-right{grid-column:3;grid-row:2}
.d-down{grid-column:2;grid-row:3}

#bomb-btn{position:absolute;bottom:16px;right:16px;width:72px;height:72px;background:var(--danger);border:none;border-radius:50%;color:#fff;font-size:28px;cursor:pointer;touch-action:none}
#bomb-btn:active{filter:brightness(1.2);transform:scale(0.95)}

/* Overlay */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(4px)}
#overlay.show{display:flex}
.overlay-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:40px;text-align:center;max-width:320px}
.overlay-card h2{font-size:24px;font-weight:800;margin-bottom:8px}
.overlay-card p{color:var(--sub);margin-bottom:24px}
.overlay-card .trophy{font-size:56px;margin-bottom:12px}
</style>
</head>
<body>

<div id="lobby">
  <div class="card">
    <div class="logo">💣</div>
    <h1>Bom<span>Bom</span></h1>
    <p class="sub">Multiplayer Bomberman — up to 4 players</p>
    <input id="nameInput" type="text" placeholder="Your name" maxlength="16">
    <button class="play" id="playBtn">Play Now</button>
    <p class="hint">Waits for 1 more player, starts in 3s</p>
  </div>
</div>

<div id="game">
  <div id="hud"></div>
  <div id="canvas-wrap">
    <canvas id="canvas"></canvas>
    <div id="dpad">
      <button class="d-up" data-dir="up">▲</button>
      <button class="d-left" data-dir="left">◀</button>
      <button class="d-center" style="font-size:14px;opacity:.3">✛</button>
      <button class="d-right" data-dir="right">▶</button>
      <button class="d-down" data-dir="down">▼</button>
    </div>
    <button id="bomb-btn">💣</button>
  </div>
</div>

<div id="overlay">
  <div class="overlay-card">
    <div class="trophy" id="trophy"></div>
    <h2 id="overlay-title"></h2>
    <p id="overlay-sub"></p>
    <button class="play" onclick="location.reload()">Play Again</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="game.js"></script>
</body>
</html>
