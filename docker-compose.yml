version: "3.8"

services:
  cinepro:
    build: ./cinepro
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file: ./cinepro/.env
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  embed-api:
    build: ./embed-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    env_file: ./embed-api/.env
    depends_on:
      cinepro:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:
    driver: bridge
